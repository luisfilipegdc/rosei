<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartaz QR Code</title>
<link rel="stylesheet" href="estilo.css">
<style>
  @page { size: A4; margin: 0; }
  body { display: flex; justify-content: center; padding: 20px 16px; }
  .folha-a4 {
    width: 210mm; max-width: 100%; aspect-ratio: 210 / 297; background: var(--fundo); border: 10px solid var(--laranja);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 6% 8%; gap: 2%;
  }
  h1 { font-size: clamp(2.4rem, 8vw, 4.6rem); margin: 0; line-height: 1; }
  p { font: 700 clamp(1.2rem, 3.5vw, 2rem) "EB Garamond", Georgia, serif; margin: 0; color: var(--texto); }
  #qrcode { background: #fff; padding: 18px; border-radius: 12px; margin: 3% 0; }
  #qrcode img, #qrcode canvas { width: min(60vw, 95mm) !important; height: auto !important; display: block; }
  .passos { font-family: "Open Sans"; font-size: clamp(.95rem, 2.4vw, 1.25rem); color: var(--texto-suave); }
  .assina { font-size: clamp(1rem, 2.5vw, 1.4rem); color: var(--texto-suave); margin-top: 3%; }
  .imprimir { position: fixed; top: 12px; right: 12px; }
  @media print { .imprimir { display: none; } body { padding: 0; } .folha-a4 { width: 210mm; height: 297mm; border: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body class="escuro">
<button class="imprimir" id="imprimir">🖨 Imprimir</button>
<div class="folha-a4">
  <h1>Compartilhe sua história!</h1>
  <p>Onde você percebeu a ação de Deus na sua vida escolar?</p>
  <div id="qrcode"></div>
  <p>📱 Aponte a câmera do celular</p>
  <div class="passos">Escreva, mande uma foto ou um vídeo — e sua história vira uma folha da nossa árvore 🍃</div>
  <p class="assina">“Tornar Jesus Cristo conhecido e amado!” — São Marcelino Champagnat</p>
</div>
<script src="vendor/qrcode.min.js"></script>
<script src="js/cartaz.js"></script>
</body>
</html>
