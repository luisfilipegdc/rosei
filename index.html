<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Árvore de Histórias</title>
<link rel="stylesheet" href="estilo.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { text-align: center; padding: 10px 16px 0; }
  header h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); }
  header p { margin: 0; color: var(--texto-suave); font-size: clamp(.9rem, 1.8vw, 1.15rem); }
  header b { color: var(--laranja); }
  main { flex: 1; position: relative; min-height: 0; }
  svg#arvore { width: 100%; height: 100%; display: block; }
  .folha { cursor: pointer; transition: transform .25s; transform-box: fill-box; transform-origin: center; }
  .folha:hover, .folha.destaque { transform: scale(1.35); }
  .folha:focus { outline: none; } .folha:focus-visible use { stroke: #fff; stroke-width: 3; }
  .folha.nova { animation: brotar 1.2s ease-out; }
  @keyframes brotar { from { transform: scale(0); } 60% { transform: scale(1.5); } to { transform: scale(1); } }
  .qr {
    position: absolute; right: 16px; bottom: 16px; background: #fff; color: var(--azul);
    padding: 10px 10px 6px; border-radius: 10px; text-align: center; width: 150px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); text-decoration: none;
  }
  .qr #qrcode img, .qr #qrcode canvas { width: 130px !important; height: 130px !important; }
  .qr span { font: 700 1.15rem "EB Garamond", Georgia, serif; display: block; line-height: 1.1; }
  .contador { position: absolute; left: 16px; bottom: 16px; font-size: 1.5rem; color: var(--texto-suave); }
  .contador b { color: var(--laranja); font-size: 2.2rem; }
  .controles { position: absolute; left: 16px; top: 8px; display: flex; gap: 8px; }
  .controles button { padding: .5em 1em; font-size: .85rem; }
  .vazio { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
  .vazio p { font: 700 2rem "EB Garamond", Georgia, serif; color: var(--texto-suave); text-align: center; margin-top: -20vh; }
  .folha.minha use { stroke: #fff; stroke-width: 4; }
  .folha.minha { animation: pulsar 2.4s ease-in-out infinite; }
  @keyframes pulsar { 50% { transform: scale(1.25); } }
  @media (min-width: 1100px) {
    .qr { width: 210px; padding: 14px 14px 10px; }
    .qr #qrcode img, .qr #qrcode canvas { width: 182px !important; height: 182px !important; }
    .qr span { font-size: 1.35rem; }
  }
  .so-celular { display: none; }

  /* ---------- CELULAR: rolagem, lista de histórias e botão fixo ---------- */
  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; overflow: auto; padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
    header { padding: 18px 16px 0; }
    header h1 { font-size: 2.1rem; line-height: 1.05; }
    header p { font-size: .95rem; margin-top: 6px; line-height: 1.45; }
    main { flex: none; height: 56vh; min-height: 320px; }
    .qr, .controles { display: none; }
    .contador { display: none; }
    .so-celular { display: block; }
    .folha:hover { transform: none; }
    .modal-fundo { align-items: flex-end; padding: 0; }
    .modal-fundo .cartao { border-radius: 18px 18px 0 0; max-height: 85vh; padding-bottom: calc(22px + env(safe-area-inset-bottom)); animation: subir .25s ease-out; }
    @keyframes subir { from { transform: translateY(40%); } }
  }
  .lista-historias { padding: 4px 16px 8px; max-width: 640px; margin: 0 auto; }
  .lista-historias .resumo { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 12px; }
  .lista-historias h2 { margin: 0; font-size: 1.6rem; }
  .lista-historias .resumo span { color: var(--texto-suave); font-size: .9rem; }
  .lista-historias .resumo b { color: var(--laranja); }
  .card-historia { background: #fff; color: var(--azul); border-radius: var(--raio); padding: 14px 16px; margin-bottom: 12px; border-left: 6px solid var(--laranja); cursor: pointer; }
  .card-historia .texto { font: 1.15rem/1.4 "EB Garamond", Georgia, serif; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card-historia .autor { font-weight: 700; color: var(--laranja-escuro); font-size: .88rem; }
  .card-historia .selo-midia { font-size: .8rem; color: var(--texto-suave); margin-left: 6px; font-weight: 400; }
  .card-historia.minha { border-left-color: var(--azul); box-shadow: 0 0 0 3px var(--laranja); }
  .selo-minha { display: inline-block; background: var(--laranja); color: #fff; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 3px 8px; border-radius: 99px; margin-bottom: 8px; }
  .cta-fixo {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--azul) 70%, rgba(19,59,100,0));
  }
  .cta-fixo .botao { display: block; text-align: center; font-size: 1.08rem; padding: 1em; min-height: 54px; }
  .modal-fundo .cartao .selo-minha { margin-bottom: 12px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="escuro">
<header>
  <h1>Compartilhe sua história!</h1>
  <p>Onde você percebeu a ação de <b>Deus</b> na sua vida escolar? Cada folha é uma história da comunidade <b>Marista</b>.</p>
</header>
<main>
  <svg id="arvore" viewBox="0 0 1000 1040" preserveAspectRatio="xMidYMid meet" aria-label="Árvore de histórias">
    <defs>
      <filter id="giz" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="ruido"/>
        <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3"/>
      </filter>
      <path id="formaFolha" d="M0,-32 C20,-22 22,10 0,32 C-22,10 -20,-22 0,-32 Z"/>
    </defs>
    <g id="tronco" filter="url(#giz)"></g>
    <g id="folhas"></g>
  </svg>
  <div class="vazio" id="vazio"><p>A árvore está esperando<br>a primeira história… 🌱</p></div>
  <div class="controles">
    <button class="secundario" id="btnApresentar" title="Mostra uma história por vez, ideal para TV">▶ Modo TV</button>
  </div>
  <div class="contador"><b id="total">0</b> histórias</div>
  <a class="qr" id="linkEnviar" href="enviar.html">
    <div id="qrcode"></div>
    <span>Aponte a câmera e deixe a sua!</span>
  </a>
</main>

<section class="lista-historias so-celular" aria-label="Histórias">
  <div class="resumo"><h2>Histórias</h2><span><b id="totalCel">0</b> folhas penduradas</span></div>
  <div id="minhasAviso"></div>
  <div id="listaCel"></div>
</section>
<div class="cta-fixo so-celular"><a class="botao" href="enviar.html">🍃 Contar minha história</a></div>

<div class="modal-fundo" id="modal">
  <div class="cartao" role="dialog" aria-modal="true">
    <button class="fechar" aria-label="Fechar">×</button>
    <div id="conteudo"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="comum.js"></script>
<script src="js/index.js"></script>
</body>
</html>
