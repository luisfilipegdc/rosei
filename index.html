<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Árvore de Histórias</title>
<link rel="stylesheet" href="estilo.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { text-align: center; padding: 10px 16px 0; }
  header h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); }
  header p { margin: 0; color: var(--texto-suave); font-size: clamp(.9rem, 1.8vw, 1.15rem); }
  header b { color: var(--laranja); }
  main { flex: 1; position: relative; min-height: 0; }
  svg#arvore { width: 100%; height: 100%; display: block; }
  .folha { cursor: pointer; transition: transform .25s; transform-box: fill-box; transform-origin: center; }
  .folha:hover, .folha.destaque { transform: scale(1.35); }
  .folha:focus { outline: none; } .folha:focus-visible use { stroke: #fff; stroke-width: 3; }
  .folha.nova { animation: brotar 1.2s ease-out; }
  @keyframes brotar { from { transform: scale(0); } 60% { transform: scale(1.5); } to { transform: scale(1); } }
  .qr {
    position: absolute; right: 16px; bottom: 16px; background: #fff; color: var(--azul);
    padding: 10px 10px 6px; border-radius: 10px; text-align: center; width: 150px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); text-decoration: none;
  }
  .qr #qrcode img, .qr #qrcode canvas { width: 130px !important; height: 130px !important; }
  .qr span { font: 700 1.15rem "EB Garamond", Georgia, serif; display: block; line-height: 1.1; }
  .contador { position: absolute; left: 16px; bottom: 16px; font-size: 1.5rem; color: var(--texto-suave); }
  .contador b { color: var(--laranja); font-size: 2.2rem; }
  .controles { position: absolute; left: 16px; top: 8px; display: flex; gap: 8px; }
  .controles button { padding: .5em 1em; font-size: .85rem; }
  .vazio { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
  .vazio p { font: 700 2rem "EB Garamond", Georgia, serif; color: var(--texto-suave); text-align: center; margin-top: -20vh; }
  .folha.minha use { stroke: #fff; stroke-width: 4; }
  .folha.minha { animation: pulsar 2.4s ease-in-out infinite; }
  @keyframes pulsar { 50% { transform: scale(1.25); } }
  @media (min-width: 1100px) {
    .qr { width: 210px; padding: 14px 14px 10px; }
    .qr #qrcode img, .qr #qrcode canvas { width: 182px !important; height: 182px !important; }
    .qr span { font-size: 1.35rem; }
  }
  .so-celular { display: none; }

  /* ---------- CELULAR: rolagem, lista de histórias e botão fixo ---------- */
  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; overflow: auto; padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
    header { padding: 18px 16px 0; }
    header h1 { font-size: 2.1rem; line-height: 1.05; }
    header p { font-size: .95rem; margin-top: 6px; line-height: 1.45; }
    main { flex: none; height: 56vh; min-height: 320px; }
    .qr, .controles { display: none; }
    .contador { display: none; }
    .so-celular { display: block; }
    .folha:hover { transform: none; }
    .modal-fundo { align-items: flex-end; padding: 0; }
    .modal-fundo .cartao { border-radius: 18px 18px 0 0; max-height: 85vh; padding-bottom: calc(22px + env(safe-area-inset-bottom)); animation: subir .25s ease-out; }
    @keyframes subir { from { transform: translateY(40%); } }
  }
  .lista-historias { padding: 4px 16px 8px; max-width: 640px; margin: 0 auto; }
  .lista-historias .resumo { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 12px; }
  .lista-historias h2 { margin: 0; font-size: 1.6rem; }
  .lista-historias .resumo span { color: var(--texto-suave); font-size: .9rem; }
  .lista-historias .resumo b { color: var(--laranja); }
  .card-historia { background: #fff; color: var(--azul); border-radius: var(--raio); padding: 14px 16px; margin-bottom: 12px; border-left: 6px solid var(--laranja); cursor: pointer; }
  .card-historia .texto { font: 1.15rem/1.4 "EB Garamond", Georgia, serif; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card-historia .autor { font-weight: 700; color: var(--laranja-escuro); font-size: .88rem; }
  .card-historia .selo-midia { font-size: .8rem; color: var(--texto-suave); margin-left: 6px; font-weight: 400; }
  .card-historia.minha { border-left-color: var(--azul); box-shadow: 0 0 0 3px var(--laranja); }
  .selo-minha { display: inline-block; background: var(--laranja); color: #fff; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 3px 8px; border-radius: 99px; margin-bottom: 8px; }
  .cta-fixo {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--azul) 70%, rgba(19,59,100,0));
  }
  .cta-fixo .botao { display: block; text-align: center; font-size: 1.08rem; padding: 1em; min-height: 54px; }
  .modal-fundo .cartao .selo-minha { margin-bottom: 12px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="escuro">
<header>
  <h1>Compartilhe sua história!</h1>
  <p>Onde você percebeu a ação de <b>Deus</b> na sua vida escolar? Cada folha é uma história da comunidade <b>Marista</b>.</p>
</header>
<main>
  <svg id="arvore" viewBox="0 0 1000 1040" preserveAspectRatio="xMidYMid meet" aria-label="Árvore de histórias">
    <defs>
      <filter id="giz" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="ruido"/>
        <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3"/>
      </filter>
      <path id="formaFolha" d="M0,-32 C20,-22 22,10 0,32 C-22,10 -20,-22 0,-32 Z"/>
    </defs>
    <g id="tronco" filter="url(#giz)"></g>
    <g id="folhas"></g>
  </svg>
  <div class="vazio" id="vazio"><p>A árvore está esperando<br>a primeira história… 🌱</p></div>
  <div class="controles">
    <button class="secundario" id="btnApresentar" title="Mostra uma história por vez, ideal para TV">▶ Modo TV</button>
  </div>
  <div class="contador"><b id="total">0</b> histórias</div>
  <a class="qr" id="linkEnviar" href="enviar.html">
    <div id="qrcode"></div>
    <span>Aponte a câmera e deixe a sua!</span>
  </a>
</main>

<section class="lista-historias so-celular" aria-label="Histórias">
  <div class="resumo"><h2>Histórias</h2><span><b id="totalCel">0</b> folhas penduradas</span></div>
  <div id="minhasAviso"></div>
  <div id="listaCel"></div>
</section>
<div class="cta-fixo so-celular"><a class="botao" href="enviar.html">🍃 Contar minha história</a></div>

<div class="modal-fundo" id="modal">
  <div class="cartao" role="dialog" aria-modal="true">
    <button class="fechar" aria-label="Fechar">×</button>
    <div id="conteudo"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="comum.js"></script>
<script>
const { sb, cfg, htmlHistoria, assinarMidias } = Arvore;

/* ---------------- Desenho da árvore em "giz" ---------------- */
// Cada galho é uma linha central com espessura. Desenhamos tudo em branco
// um pouco mais grosso e depois por cima na cor da lousa: sobra só o contorno.
const NS = "http://www.w3.org/2000/svg";
const TRONCO = "M405,985 C440,900 448,760 438,610 L562,610 C552,760 560,900 595,985 Z";
const GALHOS = [
  ["M470,640 C420,520 330,450 230,395", 52], ["M232,396 C185,350 155,305 135,250", 26],
  ["M232,396 C170,392 112,410 68,445", 22],  ["M140,262 C120,232 108,210 100,180", 12],
  ["M480,620 C455,470 425,340 385,205", 46], ["M386,208 C362,165 332,138 296,118", 20],
  ["M386,208 C402,160 410,125 402,82", 20],  ["M300,121 C275,110 255,95 240,75", 10],
  ["M525,620 C560,470 600,335 652,205", 48], ["M651,207 C684,165 722,145 765,135", 22],
  ["M651,207 C642,158 632,118 622,84", 18],  ["M762,137 C790,120 805,100 815,78", 10],
  ["M532,640 C605,540 705,488 808,438", 46], ["M806,440 C852,398 884,346 902,290", 24],
  ["M806,440 C864,450 905,478 935,515", 20], ["M900,298 C915,270 925,250 930,225", 11],
  ["M445,560 C405,480 340,470 300,500", 18], ["M560,555 C600,500 650,500 690,530", 18],
];
const CASCA = ["M470,950 C478,860 474,770 468,690", "M505,930 C510,840 506,760 510,700",
               "M535,960 C540,880 532,800 538,720", "M490,820 C495,800 500,790 498,770"];
const CHAO = "M40,990 C200,975 300,995 420,985 M580,985 C700,995 820,975 960,990";

function el(tag, attrs, pai) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  pai.appendChild(e); return e;
}
(function desenhar() {
  const g = document.getElementById("tronco");
  const GIZ = "#ffffff", LOUSA = getComputedStyle(document.body).getPropertyValue("--fundo").trim() || "#133B64";
  // passada 1: branco
  el("path", { d: TRONCO, fill: GIZ, stroke: GIZ, "stroke-width": 7 }, g);
  GALHOS.forEach(([d, w]) => el("path", { d, fill: "none", stroke: GIZ, "stroke-width": w + 7, "stroke-linecap": "round" }, g));
  // passada 2: lousa por cima
  el("path", { d: TRONCO, fill: LOUSA }, g);
  GALHOS.forEach(([d, w]) => el("path", { d, fill: "none", stroke: LOUSA, "stroke-width": w, "stroke-linecap": "round" }, g));
  CASCA.forEach(d => el("path", { d, fill: "none", stroke: GIZ, "stroke-width": 2.5, opacity: .8, "stroke-linecap": "round" }, g));
  el("path", { d: CHAO, fill: "none", stroke: GIZ, "stroke-width": 3, "stroke-linecap": "round" }, g);
})();

/* ---------------- Posições das folhas na copa ---------------- */
// Pontos espalhados na copa (elipse) em ordem embaralhada fixa: cada nova
// história ocupa o próximo lugar livre, sem mexer nas folhas já existentes.
function aleatorio(semente) { return () => ((semente = Math.imul(semente ^ (semente >>> 15), 2246822507) + 1 | 0) >>> 0) / 4294967296; }
function posicoes(qtd) {
  const n = Math.max(140, qtd), pts = [];
  for (let i = 0; i < n; i++) {
    const r = Math.sqrt((i + .5) / n), a = i * 2.39996323;
    pts.push({ x: 500 + Math.cos(a) * r * 450, y: 330 + Math.sin(a) * r * 285 });
  }
  const rnd = aleatorio(42);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  return pts;
}
const CORES = ["#F39200", "#FFB547", "#FFFFFF", "#7FB2E5", "#FFD08A", "#A9C8E8"]; // laranja e azuis Marista

/* ---------------- Dados ---------------- */
let historias = [];
const jaVistas = new Set();
// folhas enviadas por este celular (gravadas no envio)
const minhas = new Set((() => { try { return JSON.parse(localStorage.getItem("arvore-minhas")) || []; } catch { return []; } })());

async function carregar() {
  const { data: lista, error } = await sb.from("historias").select("*").eq("status", "aprovado").order("criado_em", { ascending: true });
  if (error) { console.error(error); return; }
  await assinarMidias(lista);
  const primeira = historias.length === 0 && jaVistas.size === 0;
  historias = lista;
  desenharFolhas(primeira);
}

function desenharFolhas(primeira) {
  const g = document.getElementById("folhas");
  g.innerHTML = "";
  const pts = posicoes(historias.length);
  const escala = historias.length > 140 ? Math.max(.55, Math.sqrt(140 / historias.length)) : 1;
  historias.forEach((h, i) => {
    const p = pts[i], rnd = aleatorio(i + 7);
    const ang = Math.round(rnd() * 120 - 60);
    const grupo = el("g", { class: "folha" + (minhas.has(h.id) ? " minha" : ""), tabindex: 0, role: "button", "aria-label": "Abrir história", "data-i": i }, g);
    if (!primeira && !jaVistas.has(h.id)) grupo.classList.add("nova");
    jaVistas.add(h.id);
    const t = el("g", { transform: `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${ang}) scale(${escala})` }, grupo);
    el("use", { href: "#formaFolha", fill: CORES[i % CORES.length], stroke: "rgba(0,0,0,.25)", "stroke-width": 1.5 }, t);
    el("path", { d: "M0,-25 L0,25", stroke: "rgba(0,0,0,.25)", "stroke-width": 1.5 }, t);
    if (h.midia_tipo) el("circle", { cx: 11, cy: -8, r: 5.5, fill: "#fff", stroke: "rgba(0,0,0,.35)" }, t);
    grupo.addEventListener("click", () => abrir(i));
    grupo.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(i); } });
  });
  document.getElementById("total").textContent = historias.length;
  document.getElementById("totalCel").textContent = historias.length;
  desenharLista();
  document.getElementById("vazio").style.display = historias.length ? "none" : "flex";
}

/* ---------------- Lista (celular) ---------------- */
function desenharLista() {
  const lista = document.getElementById("listaCel");
  lista.innerHTML = "";
  const ordem = historias.map((h, i) => i).reverse(); // mais recentes primeiro
  ordem.sort((a, b) => minhas.has(historias[b].id) - minhas.has(historias[a].id)); // as minhas no topo
  ordem.forEach(i => {
    const h = historias[i], card = document.createElement("article");
    card.className = "card-historia" + (minhas.has(h.id) ? " minha" : "");
    const midia = h.midia_tipo === "imagem" ? "📷 foto" : h.midia_tipo === "video" ? "🎬 vídeo" : "";
    card.innerHTML = (minhas.has(h.id) ? '<span class="selo-minha">Sua folha</span>' : "")
      + (h.mensagem ? `<p class="texto">${Arvore.esc(h.mensagem)}</p>` : "")
      + `<div class="autor">${Arvore.esc(Arvore.assinatura(h))}${midia ? `<span class="selo-midia">· ${midia}</span>` : ""}</div>`;
    card.onclick = () => abrir(i);
    lista.appendChild(card);
  });
  if (!historias.length) lista.innerHTML = '<p style="color:var(--texto-suave)">Ainda não há folhas. Que tal pendurar a primeira?</p>';
}

/* ---------------- Modal ---------------- */
const modal = document.getElementById("modal");
function abrir(i) {
  document.querySelectorAll(".folha.destaque").forEach(f => f.classList.remove("destaque"));
  document.querySelector(`.folha[data-i="${i}"]`)?.classList.add("destaque");
  document.getElementById("conteudo").innerHTML = (minhas.has(historias[i].id) ? '<span class="selo-minha">Sua folha 🍃</span>' : "") + htmlHistoria(historias[i]);
  modal.classList.add("aberto");
}
function fechar() {
  modal.classList.remove("aberto");
  modal.querySelectorAll("video").forEach(v => v.pause());
  document.querySelectorAll(".folha.destaque").forEach(f => f.classList.remove("destaque"));
}
modal.addEventListener("click", e => { if (e.target === modal || e.target.closest(".fechar")) { pararTV(); fechar(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { pararTV(); fechar(); } });

/* ---------------- Modo TV (mostra uma história por vez) ---------------- */
let timerTV = null, idxTV = -1;
const btn = document.getElementById("btnApresentar");
function proximaTV() {
  if (!historias.length) return;
  idxTV = (idxTV + 1) % historias.length;
  abrir(idxTV);
  const v = modal.querySelector("video");
  if (v) { v.muted = true; v.play().catch(() => {}); }
}
function pararTV() { clearInterval(timerTV); timerTV = null; btn.textContent = "▶ Modo TV"; }
btn.addEventListener("click", () => {
  if (timerTV) { pararTV(); fechar(); return; }
  btn.textContent = "■ Parar"; proximaTV();
  timerTV = setInterval(() => { fechar(); setTimeout(proximaTV, 900); }, 12000);
});

/* ---------------- QR code ---------------- */
const urlEnviar = new URL("enviar.html", location.href).href;
document.getElementById("linkEnviar").href = urlEnviar;
new QRCode(document.getElementById("qrcode"), { text: urlEnviar, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });

carregar().then(() => { if (new URLSearchParams(location.search).has("tv")) btn.click(); });
setInterval(carregar, cfg.ATUALIZAR_A_CADA_SEG * 1000);
</script>
</body>
</html>
